<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadeer's Website</title>
    <link rel="stylesheet" href="css/Stylesheet.css">
</head>

<body>

    <header>
        <h1>My Blog</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <h2>Contact Me</h2>

        <form>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <br><br>

            <label for="number">Number:</label>
            <input type="number" id="number" name="number">

            <br><br>

            <label for="date">Date:</label>
            <input type="date" id="date" name="date">

            <br><br>

            <p>Contact Method:</p>

            <input type="radio" id="emailMethod" name="contact" value="email">
            <label for="emailMethod">Email</label>

            <input type="radio" id="phoneMethod" name="contact" value="phone">
            <label for="phoneMethod">Phone</label>

            <br><br>

            <p>Interests:</p>

            <input type="checkbox" id="html" name="interest" value="html">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="interest" value="css">
            <label for="css">CSS</label>

            <br><br>

            <label for="course">Choose a course:</label>

            <select id="course" name="course">
                <option value="web">Web Basics</option>
                <option value="database">DataBases</option>
                <option value="programming">Programming</option>
            </select>

            <br><br>

            <label for="message">Message:</label>

            <br>

            <textarea id="message" name="message" rows="6" cols="40"></textarea>

            <br><br>

            <button type="submit">Send</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 My Blog</p>
    </footer>

</body>
</html>
